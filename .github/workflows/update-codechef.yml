name: Update CodeChef Stats Card

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

jobs:
  update-codechef-card:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate CodeChef card
        run: python scripts/update_codechef.py

      - name: Commit updated card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add assets/codechef-stats.svg

          if git diff --cached --quiet; then
            echo "No CodeChef changes."
          else
            git commit -m "Update CodeChef stats"
            git push
          fi
