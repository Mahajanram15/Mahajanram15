name: Update CodeChef Stats Card

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-codechef-card:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Generate CodeChef card
        run: python scripts/update_codechef.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/codechef-stats.svg
          if git diff --cached --quiet; then
            echo "No CodeChef changes."
          else
            git commit -m "Update CodeChef stats"
            git push
          fi
